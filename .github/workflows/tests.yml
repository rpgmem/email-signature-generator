name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:

# Every job only reads the repository; nothing here writes to it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: openssl, mbstring, json
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite=unit --testdox


  phpstan:
    name: Static analysis (PHPStan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyze --no-progress --error-format=github

  functional:
    name: Functional (PHP ${{ matrix.php }}, WP ${{ matrix.wp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            wp: 'latest'
          - php: '8.4'
            wp: 'latest'
          # The declared floor (`Requires at least` in the plugin header),
          # resolved below to its newest patch release. Without this leg the
          # floor is a claim nothing runs. The two legs above keep their names
          # because those names are required status checks.
          - php: '8.3'
            wp: 'floor'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp_esg_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mysqli, openssl, mbstring, xml, dom, simplexml
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Resolve the WordPress version
        id: wpver
        run: |
          if [ "${{ matrix.wp }}" = latest ]; then
            echo "version=latest" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          floor=$(sed -n 's/^ \* Requires at least:[[:space:]]*\([0-9.]*\).*/\1/p' email-signature-generator.php | head -n1)
          if [ -z "$floor" ]; then
            echo "::error::could not read 'Requires at least' from email-signature-generator.php"
            exit 1
          fi
          for attempt in 1 2 3; do
            if curl -fsSL --connect-timeout 20 -o "$RUNNER_TEMP/stable-check.json" https://api.wordpress.org/core/stable-check/1.0/; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::could not read the WordPress release list after 3 attempts"
              exit 1
            fi
            sleep 10
          done
          # The newest patch release of the floor branch: a site on the floor
          # gets security releases, so x.y.0 is not what it runs.
          version=$(FLOOR="$floor" LIST="$RUNNER_TEMP/stable-check.json" php -r '$v = array_keys( (array) json_decode( (string) file_get_contents( getenv( "LIST" ) ), true ) ); $f = getenv( "FLOOR" ); $m = array_values( array_filter( $v, static fn( $k ) => $k === $f || 0 === strpos( $k, $f . "." ) ) ); usort( $m, "version_compare" ); echo (string) end( $m );')
          if [ -z "$version" ]; then
            echo "::error::no WordPress release found for the floor branch $floor"
            exit 1
          fi
          echo "Floor $floor resolves to WordPress $version"
          echo "floor=$floor" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The WordPress test library has to match the core it boots: the 7.x
      # library calls APIs a 6.x core does not have. Only this runner's copy of
      # composer.json changes; the committed constraint stays on the latest.
      - name: Match the test library to the floor
        if: matrix.wp == 'floor'
        run: composer require --dev --no-interaction --no-progress -W "wp-phpunit/wp-phpunit:${{ steps.wpver.outputs.floor }}.*"

      - name: Verify environment
        run: |
          php -v
          php -m | grep -iE 'mysqli|openssl|simplexml|dom|mbstring' || true
          ls -d vendor/wp-phpunit/wp-phpunit/ || true
          ls -la bin/install-wp-tests.sh

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h127.0.0.1 -P3306 -uroot -proot --silent 2>/dev/null; then
              echo "MySQL is up."
              mysql -h127.0.0.1 -P3306 -uroot -proot -e "SELECT VERSION()"
              exit 0
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done
          echo "MySQL did not become reachable in time." >&2
          exit 1

      - name: Bootstrap WP test environment
        run: |
          set -x
          bash -x bin/install-wp-tests.sh wp_esg_tests root root 127.0.0.1:3306 true "${{ steps.wpver.outputs.version }}"
          ls -la wp-tests-config.php
          cat wp-tests-config.php

      - name: Run functional tests
        run: vendor/bin/phpunit -c phpunit.functional.xml.dist --testdox --verbose

  coverage:
    name: Coverage (PHP 8.3)
    runs-on: ubuntu-latest
    env:
      # Merged line coverage of the unit and functional suites. The floor is the
      # highest of 90%, the measured figure minus 5 points, and its current
      # value; it is never lowered (CLAUDE.md). Raised 88 -> 90 in #67, measured
      # 92.65% when set.
      COVERAGE_FLOOR_LINES: '90'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp_esg_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov
          extensions: mysqli, openssl, mbstring, xml, dom, simplexml
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Bootstrap WP test environment
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h127.0.0.1 -P3306 -uroot -proot --silent 2>/dev/null && break
            sleep 2
          done
          bash bin/install-wp-tests.sh wp_esg_tests root root 127.0.0.1:3306 true latest

      - name: Measure the unit and functional suites
        run: |
          mkdir -p build/coverage
          vendor/bin/phpunit --testsuite=unit --coverage-php build/coverage/unit.cov
          vendor/bin/phpunit -c phpunit.functional.xml.dist --coverage-php build/coverage/functional.cov

      - name: Check the floor
        run: php bin/coverage-merge.php "$COVERAGE_FLOOR_LINES" build/coverage/unit.cov build/coverage/functional.cov

  phpcs:
    name: Coding standards (PHPCS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Explicitly register the installed standards. The
      # dealerdirect/phpcodesniffer-composer-installer plugin normally handles
      # this, but registering paths here makes the build resilient if the
      # plugin is ever blocked or skipped.
      - name: Register PHPCS standards
        run: |
          vendor/bin/phpcs --config-set installed_paths \
            "vendor/wp-coding-standards/wpcs,vendor/phpcsstandards/phpcsutils,vendor/phpcsstandards/phpcsextra,vendor/phpcompatibility/php-compatibility,vendor/phpcompatibility/phpcompatibility-paragonie/PHPCompatibilityParagonieRandomCompat,vendor/phpcompatibility/phpcompatibility-paragonie/PHPCompatibilityParagonieSodiumCompat,vendor/phpcompatibility/phpcompatibility-wp"

      - name: Show PHPCS state
        run: |
          vendor/bin/phpcs --version
          vendor/bin/phpcs -i

      - name: Run PHPCS
        run: vendor/bin/phpcs --report=full --colors
