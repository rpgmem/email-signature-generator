name: Deploy develop → testes

# Syncs `develop` to the testes site over SSH + rsync on every push to
# `develop`, then runs a smoke check on the host. Ported from
# rpgmem/total-mail-queue's workflow of the same name; the plugins share the
# testes site. Setup is documented in CLAUDE.md ("Deploy to testes").

on:
  push:
    branches: [develop]
  workflow_dispatch:
    # Manual re-deploy, for when the testes site was reset or the last
    # deploy failed and develop has not moved since.

concurrency:
  # Only the latest push wins, so two rsyncs never race on one directory.
  group: deploy-develop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: rsync to testes
    runs-on: ubuntu-latest
    # Three attempts of at most 300s each, two 120s backoffs, plus checkout
    # and the smoke: 25 minutes is the hard ceiling, so the job never hangs.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.TESTES_SSH_KEY }}
          SSH_HOST: ${{ secrets.TESTES_SSH_HOST }}
          SSH_PORT: ${{ secrets.TESTES_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${SSH_PORT:-22}"
          # Best effort; the rsync falls back to accept-new (trust on first use).
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      # `--delete` empties whatever directory it is pointed at, so the path is
      # checked before anything is sent. The first deploy had a placeholder
      # value and created a stray copy in the home directory; pointed at an
      # existing directory, the same mistake would have deleted its contents.
      # Requiring `…/wp-content/plugins/<slug>` stops that, and needs no
      # connection: rsync creates only the last component, so a wrong prefix
      # fails instead of building a tree. It cannot tell testes from another
      # site on the same account; that part is the secret's job.
      - name: Check the target path
        env:
          REMOTE_PATH: ${{ secrets.TESTES_REMOTE_PATH }}
          SLUG: email-signature-generator
        run: |
          TARGET="${REMOTE_PATH%/}"
          PLUGINS="$(dirname "$TARGET")"
          case "$TARGET" in
            /*) ;;
            *) echo "::error::TESTES_REMOTE_PATH must be an absolute path."; exit 1 ;;
          esac
          if [ "$(basename "$TARGET")" != "$SLUG" ] \
            || [ "$(basename "$PLUGINS")" != "plugins" ] \
            || [ "$(basename "$(dirname "$PLUGINS")")" != "wp-content" ]; then
            echo "::error::TESTES_REMOTE_PATH must end in /wp-content/plugins/${SLUG}. Nothing was sent."
            exit 1
          fi
          echo "Target path has the expected shape."

      - name: Rsync to testes
        env:
          SSH_HOST: ${{ secrets.TESTES_SSH_HOST }}
          SSH_USER: ${{ secrets.TESTES_SSH_USER }}
          SSH_PORT: ${{ secrets.TESTES_SSH_PORT }}
          REMOTE_PATH: ${{ secrets.TESTES_REMOTE_PATH }}
        run: |
          PORT="${SSH_PORT:-22}"
          # The exclusions are `.distignore`, the same list release.yml stages
          # the zip from, so testes runs exactly what a release would ship.
          # `--delete` makes the directory an exact copy of that tree.
          #
          # BatchMode: never wait on a password prompt the runner cannot answer.
          # ConnectTimeout + 3 attempts 120s apart: a managed-hosting restart
          # lasts longer than a short backoff (the FFC deploys measured it).
          # `timeout 300`: abort a transfer that stalls after connecting.
          SSH_CMD="ssh -i ~/.ssh/deploy_key -p $PORT -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          attempt=1
          max_attempts=3
          until timeout 300 rsync -avz --delete \
            --exclude-from=.distignore \
            -e "$SSH_CMD" \
            ./ "${SSH_USER}@${SSH_HOST}:${REMOTE_PATH}/"; do
            status=$?
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::rsync to testes failed after ${max_attempts} attempts (last exit ${status})."
              exit "$status"
            fi
            echo "::warning::rsync attempt ${attempt} failed (exit ${status}); retrying in 120s…"
            sleep 120
            attempt=$((attempt + 1))
          done

      # An alarm, not a gate: the merge already happened. It answers what only
      # the host can: did the deploy land on the active plugin, and does the
      # plugin boot on the host's PHP.
      - name: Smoke test the deployed site
        env:
          SSH_HOST: ${{ secrets.TESTES_SSH_HOST }}
          SSH_USER: ${{ secrets.TESTES_SSH_USER }}
          SSH_PORT: ${{ secrets.TESTES_SSH_PORT }}
          REMOTE_PATH: ${{ secrets.TESTES_REMOTE_PATH }}
        run: |
          PORT="${SSH_PORT:-22}"
          SSH_CMD="ssh -i ~/.ssh/deploy_key -p $PORT -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"

          # The version this commit declares, read from the commit, not the host.
          VERSION=$(grep -oE "const VERSION = '[^']+'" src/plugin.php | grep -oE "'[^']+'" | tr -d "'")
          if [ -z "$VERSION" ]; then
            echo "::error::could not read Plugin::VERSION from src/plugin.php"
            exit 1
          fi

          # The script goes to a scratch directory, never into the plugin.
          REMOTE_DIR="/tmp/esg-smoke-${GITHUB_RUN_ID}"
          $SSH_CMD "${SSH_USER}@${SSH_HOST}" "mkdir -p ${REMOTE_DIR}"
          scp -i ~/.ssh/deploy_key -P "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            .github/scripts/testes-smoke.php "${SSH_USER}@${SSH_HOST}:${REMOTE_DIR}/"

          set +e
          timeout 120 $SSH_CMD "${SSH_USER}@${SSH_HOST}" \
            "php ${REMOTE_DIR}/testes-smoke.php '${REMOTE_PATH}' '${VERSION}'"
          STATUS=$?
          set -e

          $SSH_CMD "${SSH_USER}@${SSH_HOST}" "rm -rf ${REMOTE_DIR}" || true

          # A timeout is host latency, not a plugin defect: the rsync already
          # succeeded, so it warns instead of reddening the deploy.
          if [ "$STATUS" -eq 124 ]; then
            echo "::warning::smoke timed out after 120s; the deploy itself succeeded."
            exit 0
          fi
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::post-deploy smoke failed on the testes host (exit ${STATUS}). See the report above."
          fi
          exit "$STATUS"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
