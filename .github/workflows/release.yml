name: Release

on:
  push:
    tags:
      - 'v*'
  # Publishes the release of a tag that already exists, built with this
  # branch's .distignore and CHANGELOG.md: for the tags cut before this
  # workflow existed, and to rebuild a release whose notes were corrected.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build plugin zip and create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags and full history: the build checks the tag out in a worktree.
          fetch-depth: 0

      - name: Derive version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            # A release published by hand is history: it must never become
            # the one the plugin's updater reads as the latest version.
            latest=false
          else
            tag="${GITHUB_REF#refs/tags/}"
            latest=true
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+(\.[0-9]+){2,3}$'; then
            echo "::error::'$tag' is not a version tag (vX.Y.Z)."
            exit 1
          fi
          echo "tag=$tag"              >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}"      >> "$GITHUB_OUTPUT"
          echo "latest=$latest"        >> "$GITHUB_OUTPUT"
          echo "slug=email-signature-generator" >> "$GITHUB_OUTPUT"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Build the zip, the standalone HTML and the notes
        # Checks the tag's Version header against the tag, packages the tag's
        # files through .distignore and extracts its CHANGELOG section.
        run: bin/build-release-zip.sh "${{ steps.version.outputs.tag }}" build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: build/notes-${{ steps.version.outputs.version }}.md
          # The standalone HTML is absent for a tag cut before its build
          # existed; fail_on_unmatched_files is off for that reason only.
          files: |
            build/${{ steps.version.outputs.slug }}-${{ steps.version.outputs.version }}.zip
            build/${{ steps.version.outputs.slug }}-${{ steps.version.outputs.version }}.html
          fail_on_unmatched_files: false
          generate_release_notes: false
          make_latest: ${{ steps.version.outputs.latest }}

  pages:
    name: Publish the standalone generator on Pages
    needs: build
    # Only the latest release replaces the page; a historical one never does.
    if: github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
