name: Task
description: Internal work — a defect found by measurement, tech debt, an audit, maintenance
title: "<Area>: <the problem in one sentence>"
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        For work the maintainer or an agent will pick up. Write it in English, and
        state what was **measured**, not what is suspected. The acceptance criteria
        are ticked, or named as deferred, when the issue closes.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong or missing, and why it matters to an administrator or to the code.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: What was measured — counts, file:line references, a reproduction, the failing check.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What the change will do, and what it deliberately will not.
      value: |
        **In scope**
        -

        **Out of scope**
        -
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkboxes the closing PR must satisfy.
      value: |
        - [ ]
    validations:
      required: true

  - type: textarea
    id: related
    attributes:
      label: Related
    validations:
      required: false
